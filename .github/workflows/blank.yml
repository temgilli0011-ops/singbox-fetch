name: Download sing-box via API

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download from GitHub API
        run: |
          curl -L \
            -H "Accept: application/octet-stream" \
            https://api.github.com/repos/SagerNet/sing-box/releases/assets/170955938 \
            -o sing-box-1.8.10-linux-amd64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box
          path: sing-box-1.8.10-linux-amd64.tar.gz

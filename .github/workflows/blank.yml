name: Build sing-box from source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout source
        run: |
          git clone --depth=1 --branch v1.8.10 https://github.com/SagerNet/sing-box.git
          cd sing-box
          go mod download

      - name: Build sing-box
        run: |
          cd sing-box
          go build -o sing-box ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box
          path: sing-box/sing-box

